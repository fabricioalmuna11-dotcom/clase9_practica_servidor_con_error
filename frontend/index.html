<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Formulario Mascota</title>
  </head>
  <body>
    <section>
      <h2>Acciones disponibles</h2>
      <div class="botonera">
        <button id="btnBienvenida">Bienvenida de la API Mascotas</button>
        <button id="btnRutas">Info sobre los endpoints</button>
        <button id="btnDatos">Obtener toda la información persistida</button>
      </div>
      <pre id="resultado" role="status" aria-live="polite"></pre>
      <ul id="listaMascotas"></ul>
    </section>

    <section>
      <h1>Crear o editar una mascota</h1>
      <form id="formMascotas">
        <input type="hidden" id="mascotaId" />
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="tipo">Tipo:</label>
        <input type="text" id="tipo" name="tipo" required />
        <button type="submit" id="btnGuardar">Crear Mascota</button>
        <button type="button" id="btnCancelar" hidden>Cancelar edición</button>
      </form>
    </section>
    <script src="script.js"></script>
  </body>
</html>
